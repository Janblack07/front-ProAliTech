<div class="login-page">
  <div class="login-theme-switch">
    <button
      type="button"
      pButton
      pRipple
      class="theme-toggle-button"
      [icon]="themeService.theme() === 'dark' ? 'pi pi-sun' : 'pi pi-moon'"
      (click)="toggleTheme()"
      [attr.aria-label]="themeService.theme() === 'dark' ? 'Activar modo claro' : 'Activar modo oscuro'"
    ></button>
  </div>

  <div class="login-shell">
    <div class="login-card app-card">
      <div class="login-header">
        <div class="brand-logo">
          <i class="pi pi-box"></i>
        </div>

        <h1>Bienvenido a ProAliTech</h1>
        <p>Inicia sesión para continuar</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
        <div class="field">
          <label for="email">Correo electrónico</label>

          <input
            id="email"
            type="email"
            pInputText
            formControlName="email"
            placeholder="correo@empresa.com"
            class="w-full"
          />

          @if (emailControl.touched && emailControl.invalid) {
            <small class="field-error">Ingresa un correo válido.</small>
          }
        </div>

        <div class="field">
          <label for="password">Contraseña</label>

          <p-password
            inputId="password"
            formControlName="password"
            placeholder="Contraseña"
            [toggleMask]="true"
            [feedback]="false"
            styleClass="w-full"
            inputStyleClass="w-full"
          ></p-password>

          @if (passwordControl.touched && passwordControl.invalid) {
            <small class="field-error">La contraseña es obligatoria.</small>
          }
        </div>

        <div class="login-options">
          <div class="remember-option">
            <p-checkbox
              inputId="rememberme"
              [binary]="true"
              [ngModel]="rememberMe()"
              [ngModelOptions]="{ standalone: true }"
              (ngModelChange)="rememberMe.set($event)"
            />
            <label for="rememberme">Recordarme</label>
          </div>

          <a class="forgot-link">
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        @if (serverError()) {
          <div class="login-error">
            <i class="pi pi-exclamation-circle"></i>
            <span>{{ serverError() }}</span>
          </div>
        }

        <button
          pButton
          pRipple
          type="submit"
          class="login-submit-button"
          [disabled]="isSubmitDisabled"
        >
          <span class="p-button-label">
            {{ submitting() ? 'Ingresando...' : 'Iniciar sesión' }}
          </span>
        </button>
      </form>
    </div>
  </div>
</div>
